<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:each="student : ${students}">
    <a th:text="${student.name} +  ' ' + ${student.surname}" th:href="@{'/student/' + ${student.id}}"></a>
</div>
<div>
    <br>
    <a th:href="@{'/student/create'}">Add student</a>
    <br>
    <a th:href="@{'/student/delete'}">Add student</a>
</div>
</body>
</html>
